<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Scheduling Model</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f4f82'/%3E%3Cpath d='M8 0v16M0 6h16M0 11h16' stroke='white' stroke-width='1'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=2">
  <script>
    // Apply the saved theme before first paint so the page doesn't flash.
    try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <div class="brand-title">Course Scheduling Model</div>
          <div class="brand-sub">ISE 321 · AMPL integer program</div>
        </div>
      </div>
      <div class="topbar-right">
        <nav class="tabs" role="tablist">
          <button class="tab" data-view="datasets" role="tab">Datasets</button>
          <button class="tab" data-view="builder" role="tab">Case builder</button>
          <button class="tab" data-view="schedule" role="tab">Schedule <span id="tab-badge" class="tab-badge" hidden></span></button>
        </nav>
        <button id="theme-btn" class="theme-btn" type="button">
          <svg class="i-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1 1M12 12l1 1M3 13l1-1M12 4l1-1"/></svg>
          <svg class="i-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <section id="view-datasets" class="view" hidden></section>
    <section id="view-builder" class="view" hidden></section>
    <section id="view-schedule" class="view" hidden></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=2"></script>
</body>
</html>
